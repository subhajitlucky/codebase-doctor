name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run ci

      - name: Check package contents
        run: npm pack --dry-run

      - name: Guard against republish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing codebase-doctor@${VERSION}"
          if npm view "codebase-doctor@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::codebase-doctor@${VERSION} is already on npm. Bump package.json version before publishing."
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.tag || 'latest' }}"

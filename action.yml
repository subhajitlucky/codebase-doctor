name: Codebase Doctor
description: Audit a repository with codebase-doctor and produce text, JSON, SARIF, brief, Markdown, or workflow-command output.
author: Subhajit Pradhan
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Repository path to audit.
    required: false
    default: "."
  command:
    description: "Command to run: audit (full repository) or review (changed code with a PR verdict)."
    required: false
    default: audit
  base:
    description: "Base ref for review/changed scope (for example, origin/main). Empty means working-tree changes against HEAD."
    required: false
    default: ""
  format:
    description: "Output format: text, json, sarif, brief, markdown, or github."
    required: false
    default: sarif
  output:
    description: File to write the report to.
    required: false
    default: codebase-doctor.sarif
  fail-on:
    description: "Failure threshold: info, low, medium, high, critical, or none."
    required: false
    default: high
  require-complete:
    description: "Fail with exit code 2 when audit coverage is incomplete (\"true\" or \"false\")."
    required: false
    default: "false"
  run-checks:
    description: "Permit execution of detected validation commands (\"true\" or \"false\")."
    required: false
    default: "false"
  comment:
    description: "Post the markdown report as a pull-request comment (\"true\" or \"false\"). Requires format markdown and pull-requests write permission."
    required: false
    default: "false"
  with-database:
    description: "Permit the live PostgreSQL RLS audit; the caller must provide DATABASE_URL or SUPABASE_DB_URL."
    required: false
    default: "false"
  with-probe:
    description: "Run the read-only, rolled-back behavioral RLS probe against the live database."
    required: false
    default: "false"
  app-roles:
    description: "Comma-separated application roles to impersonate during probing."
    required: false
    default: ""
  subjects:
    description: "Comma-separated Supabase subjects to simulate during probing."
    required: false
    default: ""
  owner-columns:
    description: "Comma-separated ownership/tenant columns for the probe."
    required: false
    default: ""
  probe-sample-limit:
    description: "Rows sampled per table during probing."
    required: false
    default: "1000"
  database-schema:
    description: "PostgreSQL schema to audit when with-database is enabled."
    required: false
    default: "public"
  with-advisories:
    description: "Permit the opt-in OSV advisory lookup (network)."
    required: false
    default: "false"
  receipt:
    description: "Optional path for a portable review/audit receipt; uploaded as an artifact when set."
    required: false
    default: ""
  require-base:
    description: "For review: fail if base is empty instead of treating an empty checkout as a no-op."
    required: false
    default: "false"
  version:
    description: "Pinned codebase-doctor version to install from npm. Bump this with the action release."
    required: false
    default: "0.4.14"
  upload:
    description: "Upload SARIF findings to GitHub code scanning (true or false). Requires the security-events write permission."
    required: false
    default: "false"
  node-version:
    description: Node.js version used to run the CLI.
    required: false
    default: "22"

outputs:
  report:
    description: Path to the generated report file.
    value: ${{ inputs.output }}
  receipt:
    description: Path to the generated receipt, when requested.
    value: ${{ inputs.receipt }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install codebase-doctor
      shell: bash
      run: npm install --global "codebase-doctor@${{ inputs.version }}"

    - name: Run codebase-doctor
      shell: bash
      run: |
        args=("${{ inputs.command }}" "${{ inputs.path }}" --format "${{ inputs.format }}" --fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.base }}" ]; then
          args+=(--base "${{ inputs.base }}")
        elif [ "${{ inputs.command }}" = "review" ] && [ -n "${{ github.base_ref }}" ]; then
          args+=(--base "origin/${{ github.base_ref }}")
        fi
        if [ "${{ inputs.require-base }}" = "true" ]; then args+=(--require-base); fi
        if [ "${{ inputs.require-complete }}" = "true" ]; then args+=(--require-complete); fi
        if [ "${{ inputs.run-checks }}" = "true" ]; then args+=(--run-checks); fi
        if [ "${{ inputs.with-database }}" = "true" ]; then args+=(--with-database); fi
        if [ "${{ inputs.with-probe }}" = "true" ]; then
          args+=(--probe-db)
          if [ -n "${{ inputs.app-roles }}" ]; then args+=(--app-roles "${{ inputs.app-roles }}"); fi
          if [ -n "${{ inputs.subjects }}" ]; then args+=(--subjects "${{ inputs.subjects }}"); fi
          if [ -n "${{ inputs.owner-columns }}" ]; then args+=(--owner-columns "${{ inputs.owner-columns }}"); fi
          args+=(--probe-sample-limit "${{ inputs.probe-sample-limit }}")
        fi
        if [ -n "${{ inputs.database-schema }}" ]; then args+=(--database-schema "${{ inputs.database-schema }}"); fi
        if [ "${{ inputs.with-advisories }}" = "true" ]; then args+=(--with-advisories); fi
        if [ -n "${{ inputs.receipt }}" ]; then args+=(--receipt "${{ inputs.receipt }}"); fi

        codebase-doctor "${args[@]}" > "${{ inputs.output }}" && status=0 || status=$?
        if [ -f "${{ inputs.output }}" ]; then cat "${{ inputs.output }}"; fi
        echo "codebase-doctor exit code: $status"
        exit $status

    - name: Upload receipt
      if: ${{ always() && inputs.receipt != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: codebase-doctor-receipt
        path: ${{ inputs.receipt }}
        if-no-files-found: error

    - name: Comment PR with review
      if: ${{ always() && inputs.comment == 'true' && inputs.format == 'markdown' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "${{ github.event.pull_request.number }}" ]; then
          echo "codebase-doctor: no pull request context; skipping PR comment."
          exit 0
        fi
        if [ ! -f "${{ inputs.output }}" ]; then
          echo "codebase-doctor: report file is missing; skipping PR comment."
          exit 0
        fi
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "${{ inputs.output }}"

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: codebase-doctor
